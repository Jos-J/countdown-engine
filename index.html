<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" type="text/css" href="styles/main.css">
  <title> Countdown-Engine</title>
</head>

<body>

  <header>
  </header>

  <main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-black text-white">
    <div class="relative z-10 text-center">
      <h1 class="mb-6 text-2xl font-bold uppercase tracking-[0.2em] md:text-4xl">
        Countdown to College Football
      </h1>

      <div class="flex items-start justify-center gap-3 md:gap-8">
        <div class="countdown-unit">
          <span id="days" class="countdown-number">00</span>
          <span class="countdown-label">Days</span>
        </div>

        <span class="countdown-separator">:</span>

        <div class="countdown-unit">
          <span id="hours" class="countdown-number">00</span>
          <span class="countdown-label">Hours</span>
        </div>

        <span class="countdown-separator">:</span>

        <div class="countdown-unit">
          <span id="minutes" class="countdown-number">00</span>
          <span class="countdown-label">Minutes</span>
        </div>

        <span class="countdown-separator">:</span>

        <div class="countdown-unit">
          <span id="seconds" class="countdown-number">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
 
</body>

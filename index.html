<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" type="text/css" href="styles/main.css">
  <title> Countdown-Engine </title>
</head>

<body class="min-h-screen bg-black text-white">

  <div class="flex min-h-screen flex-col">

    <main class="flex flex-1 items-center justify-center px-4">
      <section class="w-full max-w-6xl text-center">

        <h1 class="mb-10 text-2xl font-bold uppercase tracking-[0.28em]
                 sm:text-3xl md:text-4xl">
          Countdown to College Football
        </h1>

        <div class="flex flex-nowrap items-start justify-center gap-1 sm:gap-3 md:gap-8">

          <div class="countdown-unit">
            <span id="days" class="countdown-number">00</span>
            <span class="countdown-label">Days</span>
          </div>

          <span class="countdown-separator">:</span>

          <div class="countdown-unit">
            <span id="hours" class="countdown-number">00</span>
            <span class="countdown-label">Hours</span>
          </div>

          <span class="countdown-separator">:</span>

          <div class="countdown-unit">
            <span id="minutes" class="countdown-number">00</span>
            <span class="countdown-label">Minutes</span>
          </div>

          <span class="countdown-separator">:</span>

          <div class="countdown-unit">
            <span id="seconds" class="countdown-number">00</span>
            <span class="countdown-label">Seconds</span>
          </div>

        </div>

      </section>
    </main>

    <footer class="py-6 text-center text-xs tracking-widest text-white/40">
      <p>&copy; 2026 Jos J Portfolio. All rights reserved.</p>
      <a href="https://www.linkedin.com/" class="transition hover:text-white">
        LinkedIn
      </a>
      <span class="mx-2">|</span>
      <a href="https://github.com/Jos-J" class="transition hover:text-white">
        GitHub
      </a>
    </footer>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
